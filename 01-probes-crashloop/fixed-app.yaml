apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: payment-api
        image: busybox:1.36
        command: ["/bin/sh", "-c", "sleep 40 && touch /tmp/healthy /tmp/ready && sleep 3600"]
        startupProbe:
          exec:
            command: ["cat", "/tmp/healthy"]
          failureThreshold: 12
          periodSeconds: 5
        readinessProbe:
          exec:
            command: ["cat", "/tmp/ready"]
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          exec:
            command: ["cat", "/tmp/healthy"]
          periodSeconds: 10
          failureThreshold: 3
