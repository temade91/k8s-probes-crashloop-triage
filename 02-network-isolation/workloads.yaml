apiVersion: v1
kind: Namespace
metadata:
  name: prod-payments
  labels:
    kubernetes.io/metadata.name: prod-payments
---
apiVersion: v1
kind: Namespace
metadata:
  name: marketing-web
  labels:
    kubernetes.io/metadata.name: marketing-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-db
  namespace: prod-payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-db
  template:
    metadata:
      labels:
        app: payments-db
    spec:
      containers:
      - name: db
        image: busybox:1.36
        command: ["/bin/sh", "-c", "nc -lk -p 5432 -e echo 'DB_OK'"]
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: payments-db
  namespace: prod-payments
spec:
  selector:
    app: payments-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: prod-payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: api
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: prod-payments
spec:
  selector:
    app: payment-api
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-ingress
  namespace: prod-payments
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: payments.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: payment-api
            port:
              number: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: rogue-client
  namespace: marketing-web
spec:
  containers:
  - name: client
    image: busybox:1.36
    command: ["sleep", "3600"]
